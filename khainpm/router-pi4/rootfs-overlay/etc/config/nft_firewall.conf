# Flush all old rulesets before loading
flush ruleset

# Declare network interface variables
define WAN_IF = "wlan0"
define LAN_IF = "eth0"

# ---------------------------------------------------------------------
# prerouting && postrouting
# ---------------------------------------------------------------------
table ip nat {
    chain prerouting {
        type nat hook prerouting priority dstnat; policy accept;
    }

    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        # Perform SNAT/Masquerade for traffic originating from LAN out to WAN
        oifname $WAN_IF masquerade
    }
}

# ---------------------------------------------------------------------
# input && forward && output
# ---------------------------------------------------------------------
table ip filter {
    chain input {
        type filter hook input priority filter; policy drop;

        # 1. Accept Loopback interface traffic
        iif "lo" accept

        # 2. Stateful: Allow packets belonging to established/related connections
        ct state established,related accept

        # 3. Drop invalid / junk state packets
        ct state invalid drop

        # 4. Allow ICMP (ping) with rate limiting (to prevent Ping Flood)
        ip protocol icmp limit rate 10/second accept

        # 5. Allow all services from trusted LAN network (eth0)
        iifname $LAN_IF accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;

        # 1. Allow LAN (eth0) to actively access WAN (wlan0)
        iifname $LAN_IF oifname $WAN_IF accept

        # 2. Stateful: Allow response packets from WAN (wlan0) back to LAN (eth0)
        iifname $WAN_IF oifname $LAN_IF ct state established,related accept

        # 3. Drop invalid packets in the forward chain
        ct state invalid drop
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}